appId: com.movieapp.mobile
---
# Start from a clean app data state on every run. The Release build contains its JS bundle,
# so the smoke test does not depend on Metro, Expo's dev launcher, or a deep-link handoff.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
