appId: com.movieapp.mobile
---
# The custom-scheme launch is confirmed by an iOS SpringBoard alert.
# Maestro's UI hierarchy exposes the system button as "Open".
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
