appId: com.movieapp.mobile
---
# iOS SpringBoard's "Open in Movie Cave?" alert is not reliably tappable
# by its accessibility label in the simulator. Tap the confirmed Open button
# location (centered in the right-hand action) using screen-relative coords.
- tapOn:
    point: "68%,54%"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
