appId: com.movieapp.mobile
---
# Dismiss the Expo development-client first-run education sheet.
# This is distinct from the iOS "Open in ..." system confirmation.
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
