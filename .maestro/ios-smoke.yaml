appId: com.movieapp.mobile
---
# First accept iOS's "Open in Movie Cave?" SpringBoard confirmation.
- tapOn:
    point: "68%,54%"
    retryTapIfNoChange: true
# Expo's first-run prompt can open the developer menu; dismiss that menu too.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
