appId: com.movieapp.mobile
---
# iOS shows a SpringBoard confirmation the first time the custom development
# URL is opened. Accept it before waiting for the app's sign-in screen.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
