appId: com.movieapp.mobile
---
# iOS presents a SpringBoard confirmation the first time the custom scheme
# opens the development client. The system alert is not consistently tappable
# by its accessibility label in the hosted simulator, so tap the confirmed
# center of the Open button (68% width, 54% height).
- tapOn:
    point: "68%,54%"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
