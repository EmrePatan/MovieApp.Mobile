appId: com.movieapp.mobile
---
# First accept iOS's "Open in Movie Cave?" SpringBoard confirmation.
- tapOn:
    point: "68%,54%"
    retryTapIfNoChange: true
# The deep link can take time to leave Expo's development-server launcher.
# Wait for the first-run education prompt instead of attempting an early optional tap.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 180000
- tapOn:
    text: "Continue"
# Continue opens Expo's developer menu. Wait until its close control is actually present.
- extendedWaitUntil:
    visible: "Close"
    timeout: 30000
- tapOn:
    text: "Close"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
