appId: com.movieapp.mobile
---
# The first launch of an Expo development build can show the developer-menu
# onboarding sheet. Dismiss it by its accessible action before asserting app UI.
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
