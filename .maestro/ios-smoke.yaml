appId: com.movieapp.mobile
---
# The first custom-scheme launch can show an iOS SpringBoard confirmation.
# Let Maestro handle it through accessibility rather than a separate UI daemon.
# This flow remains intentionally limited to the sign-in smoke check.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
