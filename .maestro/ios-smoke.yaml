appId: com.movieapp.mobile
---
# First accept iOS's "Open in Movie Cave?" SpringBoard confirmation.
- tapOn:
    point: "68%,54%"
    retryTapIfNoChange: true
# Expo development builds show a first-run developer-menu education sheet
# after the deep link is opened. Dismiss it before asserting the app screen.
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Create an account"
