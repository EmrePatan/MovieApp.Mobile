name: Mobile CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, changed-file lint and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed TypeScript files
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="${PUSH_BEFORE_SHA}"
          fi

          if [ -z "${BASE}" ] || [[ "${BASE}" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "${BASE}" ]; then
            echo "Unable to determine the base commit for changed-file lint." >&2
            exit 1
          fi

          FILES=$(git diff --name-only "${BASE}" "${GITHUB_SHA}" -- '*.ts' '*.tsx')
          if [ -z "${FILES}" ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          printf '%s\n' "${FILES}"
          printf '%s\n' "${FILES}" | xargs npx eslint

      - name: Focused Home and TV watch progress tests
        run: >-
          npm test -- --runInBand
          __tests__/features/home/useHomePersonalized.test.tsx
          __tests__/features/watch-history/watched-button.test.tsx
          __tests__/features/details/season-list-progress.test.tsx
