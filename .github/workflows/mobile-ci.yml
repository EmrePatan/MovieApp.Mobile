name: Mobile CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint and startup, auth, notification and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed TypeScript files
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="${PUSH_BEFORE_SHA}"
          fi

          if [ -z "${BASE}" ] || [[ "${BASE}" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "${BASE}" ]; then
            echo "Unable to determine the base commit for changed-file lint." >&2
            exit 1
          fi

          FILES=$(git diff --name-only "${BASE}" "${GITHUB_SHA}" -- '*.ts' '*.tsx')
          if [ -z "${FILES}" ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          printf '%s\n' "${FILES}"
          printf '%s\n' "${FILES}" | xargs npx eslint

      - name: Focused startup, auth, notification, Home and TV tests
        run: >-
          npm test -- --runInBand
          __tests__/auth/auth-bootstrap.test.tsx
          __tests__/auth/pending-auth-deep-link.test.ts
          __tests__/bootstrap/app-startup-gate.test.tsx
          __tests__/features/app-config/app-config-provider-startup.test.tsx
          __tests__/features/locale/locale-preference-provider.test.tsx
          __tests__/features/regions/regional-preference-provider.test.tsx
          __tests__/features/follows/push-device-service.test.ts
          __tests__/features/notifications/push-bootstrap.test.ts
          __tests__/features/home/useHomePersonalized.test.tsx
          __tests__/features/watch-history/watched-button.test.tsx
          __tests__/features/details/season-list-progress.test.tsx

  ios-simulator-smoke:
    name: iOS Simulator smoke tests (Maestro)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_APP_ENV: development
      # Deliberately unreachable: smoke tests must never call a production API.
      EXPO_PUBLIC_API_URL: http://127.0.0.1:9
      EXPO_PUBLIC_IMAGE_BASE_URL: https://image.tmdb.org/t/p

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION=2.12.1
          export MAESTRO_CLI_NO_ANALYTICS=1
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee "$RUNNER_TEMP/maestro-version.txt"
          grep -F "2.12.1" "$RUNNER_TEMP/maestro-version.txt"

      - name: Validate Maestro flow syntax
        run: maestro check-syntax .maestro/ios-smoke.yaml

      - name: Verify Xcode and Swift toolchain
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          SWIFT_VERSION="$(swift --version | awk '{for (i = 1; i <= NF; i++) if ($i == "version") {print $(i + 1); exit}}' | cut -d. -f1,2)"
          MIN_SWIFT_VERSION="$(printf '%s\n' "$SWIFT_VERSION" "6.2" | sort -V | head -n1)"
          if [ -z "$SWIFT_VERSION" ] || [ "$MIN_SWIFT_VERSION" != "6.2" ]; then
            echo "Swift 6.2 or newer is required by the iOS dependency graph; found $SWIFT_VERSION." >&2
            exit 1
          fi

      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          DEVICE_LINE="$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([0-9A-F-]{36}\)' || true)"
          if [ -z "$DEVICE_LINE" ]; then
            echo "No available iPhone simulator was found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi

          DEVICE_UDID="$(printf '%s\n' "$DEVICE_LINE" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          if [ -z "$DEVICE_UDID" ]; then
            echo "Could not resolve the iPhone simulator UDID." >&2
            printf '%s\n' "$DEVICE_LINE" >&2
            exit 1
          fi

          echo "Selected iOS simulator: $DEVICE_LINE"
          echo "IOS_SIMULATOR_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          if ! xcrun simctl boot "$DEVICE_UDID"; then
            if ! xcrun simctl list devices available | grep -F "$DEVICE_UDID" | grep -q "(Booted)"; then
              echo "Failed to boot simulator $DEVICE_UDID." >&2
              xcrun simctl list devices available
              exit 1
            fi
            echo "Simulator was already booted."
          fi
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build and install the embedded Release app
        shell: bash
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios

          DERIVED_DATA_PATH="$RUNNER_TEMP/MovieCaveDerivedData"
          # Ad-hoc signing supplies the simulator Keychain entitlements required by SecureStore.
          xcodebuild \
            -workspace ios/MovieCave.xcworkspace \
            -scheme MovieCave \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/MovieCave.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built simulator app was not found at $APP_PATH" >&2
            exit 1
          fi
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "Release JavaScript bundle is missing from $APP_PATH; Maestro must not depend on Metro." >&2
            find "$APP_PATH" -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          xcrun simctl install "$IOS_SIMULATOR_UDID" "$APP_PATH"
          # Maestro launches the installed Release app; no Metro or dev-client deep link is needed.

      - name: Run Maestro iOS smoke flow
        run: maestro test --device "$IOS_SIMULATOR_UDID" .maestro/ios-smoke.yaml

      - name: Collect iOS smoke diagnostics
        if: always()
        shell: bash
        run: |
          DIAGNOSTICS_DIR="$RUNNER_TEMP/ios-smoke-diagnostics"
          mkdir -p "$DIAGNOSTICS_DIR"
          xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot "$DIAGNOSTICS_DIR/simulator.png" || true
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show --last 5m --style compact --predicate 'process == "MovieCave"' > "$DIAGNOSTICS_DIR/app.log" 2>&1 || true
          if [ -d "$HOME/.maestro/tests" ]; then
            cp -R "$HOME/.maestro/tests" "$DIAGNOSTICS_DIR/maestro-tests"
          fi

      - name: Upload iOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-diagnostics
          path: ${{ runner.temp }}/ios-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
