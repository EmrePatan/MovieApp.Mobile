name: Mobile CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, changed-file lint and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed TypeScript files
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="${PUSH_BEFORE_SHA}"
          fi

          if [ -z "${BASE}" ] || [[ "${BASE}" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "${BASE}" ]; then
            echo "Unable to determine the base commit for changed-file lint." >&2
            exit 1
          fi

          FILES=$(git diff --name-only "${BASE}" "${GITHUB_SHA}" -- '*.ts' '*.tsx')
          if [ -z "${FILES}" ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          printf '%s\n' "${FILES}"
          printf '%s\n' "${FILES}" | xargs npx eslint

      - name: Focused Home and TV watch progress tests
        run: >-
          npm test -- --runInBand
          __tests__/features/home/useHomePersonalized.test.tsx
          __tests__/features/watch-history/watched-button.test.tsx
          __tests__/features/details/season-list-progress.test.tsx

  ios-simulator-smoke:
    name: iOS Simulator smoke tests (Maestro)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_APP_ENV: development
      # Deliberately unreachable: smoke tests must never call a production API.
      EXPO_PUBLIC_API_URL: http://127.0.0.1:9
      EXPO_PUBLIC_IMAGE_BASE_URL: https://image.tmdb.org/t/p

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        shell: bash
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Verify Xcode and Swift toolchain
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          SWIFT_VERSION="$(swift --version | awk '{for (i = 1; i <= NF; i++) if ($i == "version") {print $(i + 1); exit}}' | cut -d. -f1,2)"
          MIN_SWIFT_VERSION="$(printf '%s\n' "$SWIFT_VERSION" "6.2" | sort -V | head -n1)"
          if [ -z "$SWIFT_VERSION" ] || [ "$MIN_SWIFT_VERSION" != "6.2" ]; then
            echo "Swift 6.2 or newer is required by the iOS dependency graph; found $SWIFT_VERSION." >&2
            exit 1
          fi

      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          DEVICE_LINE="$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([0-9A-F-]{36}\)' || true)"
          if [ -z "$DEVICE_LINE" ]; then
            echo "No available iPhone simulator was found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi

          DEVICE_UDID="$(printf '%s\n' "$DEVICE_LINE" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          if [ -z "$DEVICE_UDID" ]; then
            echo "Could not resolve the iPhone simulator UDID." >&2
            printf '%s\n' "$DEVICE_LINE" >&2
            exit 1
          fi

          echo "Selected iOS simulator: $DEVICE_LINE"
          echo "IOS_SIMULATOR_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build and install the Expo development app
        shell: bash
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios

          DERIVED_DATA_PATH="$RUNNER_TEMP/MovieCaveDerivedData"
          xcodebuild \
            -workspace ios/MovieCave.xcworkspace \
            -scheme MovieCave \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/MovieCave.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built simulator app was not found at $APP_PATH" >&2
            exit 1
          fi

          xcrun simctl install "$IOS_SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$IOS_SIMULATOR_UDID" com.movieapp.mobile

      - name: Start Metro for the development client
        shell: bash
        run: |
          NETWORK_INTERFACE="$(route -n get default | awk '/interface:/{print $2}')"
          DEV_SERVER_HOST="$(ipconfig getifaddr "$NETWORK_INTERFACE" 2>/dev/null || true)"
          if [ -z "$DEV_SERVER_HOST" ]; then
            DEV_SERVER_HOST="$(ipconfig getifaddr en0 2>/dev/null || true)"
          fi
          if [ -z "$DEV_SERVER_HOST" ]; then
            echo "Could not determine the macOS runner LAN address for the iOS simulator." >&2
            route -n get default
            exit 1
          fi

          echo "DEV_SERVER_URL=http://$DEV_SERVER_HOST:8081" >> "$GITHUB_ENV"
          echo "Starting Metro on the runner LAN address: $DEV_SERVER_HOST"
          nohup npx expo start --dev-client --host lan --port 8081 > /tmp/expo-metro.log 2>&1 &
          METRO_PID=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "http://$DEV_SERVER_HOST:8081/status" >/dev/null; then
              echo "Metro is ready at $DEV_SERVER_URL (PID: $METRO_PID)."
              exit 0
            fi
            if ! kill -0 "$METRO_PID" 2>/dev/null; then
              echo "Metro process exited before becoming ready." >&2
              cat /tmp/expo-metro.log
              exit 1
            fi
            sleep 2
          done

          cat /tmp/expo-metro.log
          echo "Metro did not become ready in time at $DEV_SERVER_URL." >&2
          exit 1

      - name: Open the running Expo development bundle
        shell: bash
        run: |
          DEV_SERVER_URL="${DEV_SERVER_URL:?DEV_SERVER_URL was not set by the Metro step}"
          ENCODED_DEV_SERVER_URL="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$DEV_SERVER_URL")"
          DEV_CLIENT_URL="movieapp://expo-development-client/?url=$ENCODED_DEV_SERVER_URL"

          echo "Opening Expo development client with the reachable runner LAN URL: $DEV_SERVER_URL"
          xcrun simctl openurl "$IOS_SIMULATOR_UDID" "$DEV_CLIENT_URL"
          # Maestro handles the first-launch SpringBoard confirmation in the smoke flow.
          sleep 2

      - name: Run Maestro iOS smoke flow
        run: maestro test --device "$IOS_SIMULATOR_UDID" .maestro/ios-smoke.yaml

      - name: Collect iOS smoke diagnostics
        if: always()
        shell: bash
        run: |
          DIAGNOSTICS_DIR="$RUNNER_TEMP/ios-smoke-diagnostics"
          mkdir -p "$DIAGNOSTICS_DIR"
          xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot "$DIAGNOSTICS_DIR/simulator.png" || true
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show --last 5m --style compact --predicate 'process == "MovieCave"' > "$DIAGNOSTICS_DIR/app.log" 2>&1 || true
          if [ -d "$HOME/.maestro/tests" ]; then
            cp -R "$HOME/.maestro/tests" "$DIAGNOSTICS_DIR/maestro-tests"
          fi

      - name: Upload iOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-diagnostics
          path: ${{ runner.temp }}/ios-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Metro log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-metro-log
          path: /tmp/expo-metro.log
          if-no-files-found: ignore
          retention-days: 7
