name: iOS Simulator E2E

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-smoke:
    name: iOS Simulator smoke tests (Maestro)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_APP_ENV: development
      # Deliberately unreachable: smoke tests must never call a production API.
      EXPO_PUBLIC_API_URL: http://127.0.0.1:9
      EXPO_PUBLIC_IMAGE_BASE_URL: https://image.tmdb.org/t/p

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        shell: bash
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          DEVICE_LINE="$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([0-9A-F-]{36}\)' || true)"
          if [ -z "$DEVICE_LINE" ]; then
            echo "No available iPhone simulator was found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi

          DEVICE_UDID="$(printf '%s\n' "$DEVICE_LINE" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "IOS_SIMULATOR_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build and install the Expo development app
        run: npx expo run:ios --device "$IOS_SIMULATOR_UDID" --no-bundler --configuration Debug

      - name: Start Metro for the development client
        shell: bash
        run: |
          nohup npx expo start --dev-client --host localhost --port 8081 > /tmp/expo-metro.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8081/status >/dev/null; then
              echo "Metro is ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/expo-metro.log
          echo "Metro did not become ready in time." >&2
          exit 1

      - name: Open the running Expo development bundle
        shell: bash
        run: |
          DEV_CLIENT_URL="$(grep -Eo 'exp\\+[^[:space:]]+' /tmp/expo-metro.log | head -n1 | sed 's/[[:punct:]]*$//')"
          if [ -z "$DEV_CLIENT_URL" ]; then
            cat /tmp/expo-metro.log
            echo "Expo did not print a development-client URL." >&2
            exit 1
          fi

          echo "Opening the Expo development client."
          xcrun simctl openurl "$IOS_SIMULATOR_UDID" "$DEV_CLIENT_URL"
          sleep 10

      - name: Run Maestro iOS smoke flow
        run: maestro test --device "$IOS_SIMULATOR_UDID" .maestro/ios-smoke.yaml

      - name: Upload Metro log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-metro-log
          path: /tmp/expo-metro.log
          if-no-files-found: ignore
          retention-days: 7
